<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VF Tools</title>
<meta name="description" content="Coleção de ferramentas criadas por Vitor Farias.">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <nav class="top">
      <span class="logo"><b>VF</b> Tools</span>
      <button id="theme" class="icon-btn" aria-label="Alternar tema">◐</button>
    </nav>
    <h1>Ferramentas que eu construí.</h1>
    <p class="lead">Utilitários, bots e apps — filtre por categoria, tecnologia ou status.</p>
    <div class="search"><input id="q" type="search" placeholder="Buscar ferramenta…" aria-label="Buscar"></div>
  </div>
</header>
<main class="wrap">
  <section class="filters" aria-label="Filtros">
    <div id="cats" class="chips"></div>
    <div class="row">
      <div id="tags" class="chips small"></div>
      <div class="selects">
        <select id="status" aria-label="Status"><option value="">Todos os status</option></select>
        <select id="sort" aria-label="Ordenar">
          <option value="name">A–Z</option>
          <option value="status">Status</option>
        </select>
      </div>
    </div>
  </section>
  <p id="count" class="count"></p>
  <section id="grid" class="grid"></section>
  <p id="empty" class="empty" hidden>Nenhuma ferramenta encontrada. <button id="clear" class="link">Limpar filtros</button></p>
</main>
<footer class="wrap foot">© <span id="y"></span> Vitor Farias · <a href="https://github.com/VitorFariasVF">GitHub</a></footer>
<script src="data/tools.js"></script>
<script src="app.js"></script>
</body>
</html>
